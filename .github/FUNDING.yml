# GitHub 会在仓库页顶部渲染一个 Sponsor ❤ 按钮，内容来自本文件。
#
# 说明：custom 里必须是完整的 https 链接。微信/支付宝收款码是图片而非网页，
# 无法直接作为链接目标，所以这里指向 README 的「赞赏」章节，点进去即可看到收款码。
#
# 如果想关掉 Sponsor 按钮，删掉下面 custom 这段即可（GitHub 就不会渲染了）。

custom:
  - "https://github.com/konmins/delfin#赞赏"

# 如果以后开了爱发电，把下面这行取消注释并填上主页地址（可与上面的 custom 并存）：
#   - "https://afdian.com/a/YOUR_AFDIAN_ID"
#
# 如果以后满足了 GitHub Sponsors 的开通条件，取消下面这行注释：
# github: [konmins]
